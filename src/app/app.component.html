<h1>{{ title }}</h1>

<div class="task-input">
  <input type="text" [(ngModel)]="newTask" placeholder="Enter a new task" />
  <button (click)="addTask()">Add Task</button>
</div>

<div class="task-dropdown" [class.open]="tasks.length > 0">
  <button class="dropdown-btn" (click)="toggleDropdown()">
    Tasks ({{ tasks.length }}) ▼
  </button>

  <ul *ngIf="isDropdownOpen">
    <li
      *ngFor="let task of tasks; let i = index"
      [class.completed]="task.completed"
    >
      <span (click)="toggleComplete(task)">{{ task.text }}</span>
      <button (click)="deleteTask(i)">Delete</button>
    </li>
  </ul>
</div>
